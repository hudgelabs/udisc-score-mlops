name: MLOps CI
on: [push]
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install flake8 pytest httpx pandas scikit-learn mlflow fastapi uvicorn
      - name: Lint with flake8
        run: flake8
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python3 -m pytest tests/test_api.py